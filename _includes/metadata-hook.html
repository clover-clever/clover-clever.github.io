<!-- Clear stale Chirpy PWA registrations on updated pages. -->
<script>
  (() => {
    if (!('serviceWorker' in navigator)) return;
    window.addEventListener('load', async () => {
      try {
        const registrations = await navigator.serviceWorker.getRegistrations();
        const oldRegistrations = registrations.filter((registration) => {
          const scope = new URL(registration.scope);
          return scope.origin === location.origin && scope.pathname === '/';
        });
        await Promise.all(oldRegistrations.map((registration) => registration.unregister()));
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(
            keys.filter((key) => key.startsWith('chirpy-')).map((key) => caches.delete(key))
          );
        }
      } catch (error) {
        // Normal page navigation still works if storage access is restricted.
      }
    });
  })();
</script>
